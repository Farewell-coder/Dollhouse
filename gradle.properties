# 【不要在此写 sdk.dir / android.aapt2FromMavenOverride】
# 这两项都是**机器本地路径**，写进版本库会让别人的构建直接失败：
#   - sdk.dir：本机是 /root/Android，CI 上是 /usr/local/lib/android/sdk
#   - android.aapt2FromMavenOverride：本机（arm64）必须指向 aarch64 版 aapt2，
#     因为 AGP 从 Maven 拉的 aapt2 是 x86-64 ELF，手机上跑不了；
#     而 CI 的 runner 是 x86-64，本来就能直接用 Maven 版，**指定路径反而报**
#     「Specified AAPT2 executable does not exist」。
# 正确做法：这两项放在**不受版本控制**的配置里：
#   - 本机：~/.gradle/gradle.properties 或项目根 local.properties（已在 .gitignore）
#   - CI ：什么都不用配，自动用 SDK 自带的
# 踩过的坑：CI run 40760881957 就是因为这里写了 /root/Android/... 而失败，
#   且失败点在 aapt2 资源编译，报错完全不提路径来源，极难定位。

org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
# 保留 JVM 与跨任务产物，避免每轮构建重复初始化 Gradle/Kotlin。
org.gradle.daemon=true
org.gradle.caching=true
# 单应用模块不依赖并行调度，不增加手机上的 JVM 数量。
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=false
# 【本机专用项已移出】aapt2 覆盖与 sdk.dir 见文件头说明，
# 请放在 ~/.gradle/gradle.properties（不受版本控制）。
# AGP 8.5.2 官方只支持到 compileSdk 34，压制噪音
android.suppressUnsupportedCompileSdk=35
# 关闭资源名混淆：否则 res/ 被压成 4w.png 这类短名，排障困难且不利于产物对比
android.enableResourceOptimizations=false

# Kotlin 增量编译 daemon 内存上限：本机 12GB RAM / 可用约 4GB。
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
kapt.use.worker.api=false

# 【无感保活】Hilt 的处理器是 aggregating 类型，与 kapt 增量注解处理不兼容：
#   增量模式下二次构建只重生成变更文件的 stub，Hilt 重新聚合时会解析不到未变更的旧 stub，
#   报 "InjectProcessingStep was unable to process ... could not be resolved"。必须关掉增量。
kapt.incremental.apt=false
