sdk.dir=/root/Android
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=384m
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=false
android.nonTransitiveRClass=false
# arm64 设备必需：AGP 从 Maven 拉的 aapt2 是 x86-64 ELF，本机跑不了。
# 指向系统自带 aarch64 静态版 aapt2（build-tools 35.0.0）。
android.aapt2FromMavenOverride=/root/Android/build-tools/35.0.0/aapt2
# AGP 8.5.2 官方只支持到 compileSdk 34，压制噪音
android.suppressUnsupportedCompileSdk=35
# 关闭资源名混淆：否则 res/ 被压成 4w.png 这类短名，排障困难且不利于产物对比
android.enableResourceOptimizations=false
