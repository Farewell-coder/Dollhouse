name: build

# 【职责】CI 底座 + 正式签名出包。
#
# 触发：
#   · push / PR        → 跑单元测试 + 编译 release，已签名 APK 传成 artifact（可下载，保留 90 天）
#   · push tag v*      → 额外把 APK 传到 GitHub Release（永久下载链接）
#   · workflow_dispatch → 手动跑一次
#
# 【签名】密钥不进版本库，运行时从仓库 Secrets 取：
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 解出 ci-keystore.jks 后在工作区根目录生成 keystore.properties，
# app/build.gradle 里既有的 `rootProject.file('keystore.properties')` 会自动读取。
# 缺任一 Secret 直接报错退出，**不会**偷偷生成临时签名。
#
# 【为什么显式指定 setup-android 的 packages】v3 默认请求 "tools platform-tools"，
#   Google 已于 2026-09-17 把 `tools` 包下架，sdkmanager 直接 exit 1。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 工程 compileSdk = 36、build-tools 35.0.0
      - name: 安装编译平台
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/ci-keystore.jks"
          if [ ! -s "${GITHUB_WORKSPACE}/ci-keystore.jks" ]; then
            echo "::error::KEYSTORE_BASE64 解码失败，请确认是完整的 base64 内容"
            exit 1
          fi
          cat > "${GITHUB_WORKSPACE}/keystore.properties" <<EOF
          storeFile=${GITHUB_WORKSPACE}/ci-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          chmod 600 "${GITHUB_WORKSPACE}/ci-keystore.jks" "${GITHUB_WORKSPACE}/keystore.properties"
          keytool -list -keystore "${GITHUB_WORKSPACE}/ci-keystore.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "签名配置就绪"

      - name: 赋权 gradlew
        run: chmod +x ./gradlew

      # 【静态门禁】放在编译前跑：比等 8 分钟编译完再报错快得多。
      #   align_audit  —— 「容器有边界但内容没居中」（Compose 里 Row/Column/Box 的默认对齐都不是居中）
      #   radius_audit —— 「圆角 > 元素半短边会变成药丸/变形」（上一轮 Radius.md 12→16 让 30dp 元素全部变形，
      #                   用户原话「很丑很丑」，就是缺这道门禁）
      #   两者都做过反向验证：注入必须报、删除必须过。
      - name: 静态门禁（居中 / 圆角比例）
        run: |
          python3 tools/align_audit.py --quiet
          python3 tools/radius_audit.py --quiet
          python3 tools/kotlin_precheck.py
          python3 tools/comment_balance.py

      - name: 单元测试
        run: ./gradlew test --stacktrace

      - name: 编译 release（含签名）
        run: ./gradlew assembleRelease --stacktrace

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 校验签名
        run: |
          set -e
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::没有生成任何 APK"
            exit 1
          fi
          for a in "${APKS[@]}"; do
            echo "===== $a"
            "$APKSIGNER" verify --print-certs "$a"
          done

      - name: 上传 APK（Artifacts，保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: dollhouse-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上传测试报告（失败时便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # 【视觉回归】Robolectric 截图测试产出的 PNG。
      #   用途：让"设计改成了什么样"变成一张可下载、可比对的图，
      #   而不是靠静态推算（本项目的对比度一直是公式算的，从没在屏幕上确认过）。
      #   `if-no-files-found: warn` 而不是 error：截图测试若因环境原因未产出，
      #   不应该把整轮 CI 判红 —— 但日志里会显式警告，不会被静默忽略。
      - name: 上传设计截图（视觉回归）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-screenshots
          path: app/build/screenshot/
          if-no-files-found: warn
          retention-days: 30

      # 只有打 tag（v*）才发 Release
      # 发布前先确认更新公告存在且非空：否则宁可失败，也不要发出一个空正文的 Release。
      - name: 校验更新公告
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md 缺失或为空。发版前必须先写好更新公告并提交。"
            exit 1
          fi
          echo "更新公告 $(wc -c < RELEASE_NOTES.md) 字节"

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dollhouse ${{ github.ref_name }}
          # v0.2.1 起：更新公告纳入仓库管理，不再由 CI 写固定模板。
          # 每次发版前改根目录 RELEASE_NOTES.md 一并提交，CI 直接引用。
          # 优点：公告随代码一起版本化，不依赖人工事后补，也不会被模板覆盖。
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
