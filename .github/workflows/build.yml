name: build

# 【职责】最小 CI 底座（建议①）：每次 push / PR 跑单元测试 + 编译 release。
#
# 【为什么只做这两件事】工程此前零 CI，发版全靠本地手动跑一次 10~19 分钟的 R8 构建，
#   改坏了没人拦。这里先立两根最低成本的护栏：
#   · `test`  —— 纯 JVM 单元测试（SemVer / Springs / BlinkTimeline），秒级、零设备依赖；
#   · `assembleRelease` —— 真编译一遍（含 R8），能拦住「本地没编就提交」的大部分事故。
#   【不签名】CI 上没有 keystore（keystore.properties 不入版本库，见 .gitignore），
#   release 构建会自动跳过 signingConfig 分支 —— 这是工程既有的降级设计，正好适合 CI。
#
# 【为什么不开真机测试】与工程既有约束一致：不跑 androidTest / 不接模拟器，
#   保持 CI 在 GitHub 免费额度内且稳定（模拟器在 CI 上又慢又爱挂）。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 赋权 gradlew
        run: chmod +x ./gradlew

      - name: 单元测试
        run: ./gradlew test --stacktrace

      - name: 编译 release（不签名）
        run: ./gradlew assembleRelease --stacktrace

      - name: 上传测试报告（失败时便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
