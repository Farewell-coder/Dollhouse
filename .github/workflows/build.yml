name: build

# 【职责】最小 CI 底座（建议①）：每次 push / PR 跑单元测试 + 编译 release。
#
# 【为什么只做这两件事】工程此前零 CI，发版全靠本地手动跑一次 10~19 分钟的 R8 构建，
#   改坏了没人拦。这里先立两根最低成本的护栏：
#   · `test`  —— 纯 JVM 单元测试（SemVer / Springs / BlinkTimeline），秒级、零设备依赖；
#   · `assembleRelease` —— 真编译一遍（含 R8），能拦住「本地没编就提交」的大部分事故。
#   【不签名】CI 上没有 keystore（keystore.properties 不入版本库，见 .gitignore），
#   release 构建会自动跳过 signingConfig 分支 —— 这是工程既有的降级设计，正好适合 CI。
#
# 【为什么不开真机测试】与工程既有约束一致：不跑 androidTest / 不接模拟器，
#   保持 CI 在 GitHub 免费额度内且稳定（模拟器在 CI 上又慢又爱挂）。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 【必须显式指定 packages】v3 默认请求 "tools platform-tools"，
          # 而 Google 已于 2026-09-17 把 `tools` 包从 SDK 仓库下架，
          # sdkmanager 直接 exit 1：Warning: Failed to find package 'tools'。
          # 后果不是「少装个工具」，而是**整个 job 在装 SDK 这一步就挂了**，
          # 单元测试与 release 编译一次都没跑起来（构建结论为「失败」但代码其实没问题）。
          # 现在只要求 platform-tools（提供 adb 等），
          # platform 与 build-tools 由 AGP 按 build.gradle 声明自动下载，
          # 这一步只需要提供 sdkmanager 并接受许可。
          packages: 'platform-tools'

      # 【显式安装编译所需平台】工程 compileSdk = 36、build-tools 35.0.0。
      # 交给 AGP 自动下载也能work，但「自动下载」与「接受许可」在无交互 CI 上
      # 偶发因许可未接受而中断；显式装一次把不确定性提前消灭。
      - name: 安装编译平台
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 赋权 gradlew
        run: chmod +x ./gradlew

      - name: 单元测试
        run: ./gradlew test --stacktrace

      - name: 编译 release（不签名）
        run: ./gradlew assembleRelease --stacktrace

      - name: 上传测试报告（失败时便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
